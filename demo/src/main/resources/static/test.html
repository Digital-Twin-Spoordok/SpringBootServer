<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Praat met Qwen</title><style>
:root{color-scheme:dark;--bg:#0b1020;--line:#29354d;--text:#eff5ff;--muted:#9baac3;--cyan:#67e8f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 10%,#3b4c9130,transparent 42%),radial-gradient(ellipse at 90% 90%,#13a6a529,transparent 38%),var(--bg);font:16px/1.5 Inter,system-ui,sans-serif;color:var(--text)}main{width:min(100%,760px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-weight:800;letter-spacing:.12em}.tag,code{font:12px ui-monospace,monospace;color:#c3cde0;border:1px solid var(--line);padding:7px 10px;border-radius:99px}.card{border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#172135,#0f1626);padding:clamp(22px,5vw,38px);box-shadow:0 30px 90px #0007}h1{font-size:clamp(32px,6vw,48px);letter-spacing:-.05em;line-height:1.08;margin:0 0 12px}h1 span{color:var(--cyan)}p{margin:0;color:var(--muted)}.messages{height:min(48vh,420px);min-height:220px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:22px 0}.bubble{max-width:88%;padding:13px 16px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.assistant{align-self:flex-start;background:#ffffff0b;border:1px solid var(--line)}.user{align-self:flex-end;background:#67e8f91b;border:1px solid #67e8f941}.error{color:#fda4af;border-color:#fb718555}.form{display:flex;gap:12px}.form textarea{flex:1;resize:vertical;min-height:58px;max-height:160px;border:1px solid #34415b;border-radius:14px;background:#080e1a;color:var(--text);padding:15px;font:inherit;outline:none}.form textarea:focus{border-color:var(--cyan)}button{border:0;border-radius:14px;padding:0 22px;background:linear-gradient(100deg,var(--cyan),#a5b4fc);font-weight:800;color:#091321;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:17px;color:var(--muted);font-size:12px}.foot code{border-radius:8px;color:#d5e1f7;background:#ffffff0a}@media(max-width:560px){header,.foot{align-items:flex-start;gap:10px;flex-direction:column}.form{flex-direction:column}.form button{height:52px}}
</style></head><body><main><header><div class="brand">◈ LOKALE AI</div><span class="tag">SPRING BOOT · qwen3.5:4b</span></header><section class="card"><h1>Praat met <span>Qwen.</span></h1><p>Je bericht gaat via Spring Boot naar Ollama op je eigen pc.</p><div id="messages" class="messages" aria-live="polite"><div class="bubble assistant">Hoi! Ik ben Qwen. Stel me gerust een vraag.</div></div><form id="form" class="form"><label for="message" hidden>Jouw bericht</label><textarea id="message" maxlength="4000" rows="2" placeholder="Typ je bericht…" required></textarea><button id="send" type="submit">Verstuur ↗</button></form><div class="foot"><span>Antwoorden worden lokaal gegenereerd via Ollama.</span><code>POST /api/assistant/chat</code></div></section></main><script>
const form=document.querySelector('#form'),input=document.querySelector('#message'),messages=document.querySelector('#messages'),send=document.querySelector('#send');function add(text,kind){const el=document.createElement('div');el.className='bubble '+kind;el.textContent=text;messages.append(el);messages.scrollTop=messages.scrollHeight;return el}form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;add(message,'user');input.value='';send.disabled=true;send.textContent='Qwen denkt…';const reply=add('Even nadenken…','assistant');try{const response=await fetch('/api/assistant/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});const data=await response.json();if(!response.ok)throw new Error(data.detail||data.message||'Ollama is niet bereikbaar.');reply.textContent=data.answer}catch(error){reply.classList.add('error');reply.textContent=error.message}finally{send.disabled=false;send.textContent='Verstuur ↗';input.focus()}});
</script></body></html>
