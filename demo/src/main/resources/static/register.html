<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registreren | DigiTwin</title>
    <link rel="stylesheet" href="/css/auth.css">
    <script src="/js/auth.js" defer></script>
</head>

<body>
    <main class="auth-container">
        <section class="auth-card">
            <a href="/login.html" class="brand">
                <div class="brand-icon">D</div>
                <span>DigiTwin</span>
            </a>

            <div class="auth-heading">
                <span class="eyebrow">DIGITAL TWIN PLATFORM</span>
                <h1>Account aanmaken</h1>
                <p>Maak een account aan om aan de slag te gaan.</p>
            </div>

            <form id="register-form" class="auth-form">
                <label for="name">Volledige naam</label>
                <input type="text" id="name" name="name" placeholder="Je naam" autocomplete="name" required>

                <label for="email">E-mailadres</label>
                <input type="email" id="email" name="email" placeholder="naam@example.com" autocomplete="email"
                    required>

                <label for="password">Wachtwoord</label>
                <input type="password" id="password" name="password" placeholder="Minimaal 8 tekens" minlength="8"
                    autocomplete="new-password" required>

                <label for="confirm-password">Wachtwoord bevestigen</label>
                <input type="password" id="confirm-password" name="confirmPassword" placeholder="Herhaal je wachtwoord"
                    minlength="8" autocomplete="new-password" required>

                <div id="auth-message" class="auth-message" role="alert"></div>

                <button type="submit" id="auth-submit" class="auth-button">
                    Account aanmaken <span>→</span>
                </button>
            </form>

            <div class="auth-footer">
                Heb je al een account?
                <a href="/login.html">Inloggen</a>
            </div>
        </section>

        <footer class="auth-bottom">
            DigiTwin Platform · Digital Twin Environment
        </footer>
    </main>
</body>

</html>
