<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen | DigiTwin</title>
    <link rel="stylesheet" href="/css/auth.css">
    <script src="/js/auth.js" defer></script>
</head>

<body>
    <main class="auth-container">
        <section class="auth-card">
            <a href="/index.html" class="brand">
                <div class="brand-icon">D</div>
                <span>DigiTwin</span>
            </a>

            <div class="auth-heading">
                <span class="eyebrow">DIGITAL TWIN PLATFORM</span>
                <h1>Welkom terug</h1>
                <p>Log in om toegang te krijgen tot jouw Digital Twin.</p>
            </div>

            <form id="login-form" class="auth-form">
                <label for="email">E-mailadres</label>
                <input type="email" id="email" name="email" placeholder="naam@example.com" autocomplete="email"
                    required>

                <label for="password">Wachtwoord</label>
                <input type="password" id="password" name="password" placeholder="Je wachtwoord"
                    autocomplete="current-password" required>

                <div id="auth-message" class="auth-message" role="alert"></div>

                <button type="submit" id="auth-submit" class="auth-button">
                    Inloggen <span>→</span>
                </button>
            </form>

            <div class="auth-footer">
                Nog geen account?
                <a href="/register.html">Account aanmaken</a>
            </div>
        </section>

        <footer class="auth-bottom">
            DigiTwin Platform · Digital Twin Environment
        </footer>
    </main>
</body>

</html>
